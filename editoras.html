<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Editor - App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Menú de Navegación Fijo -->
    <header id="main-header">
        <nav class="navbar">
            <div class="logo-container">
                <a href="index.html" id="site-logo-text">App</a>
            </div>
            <ul id="menu-list" class="nav-links">
                <!-- Se inyecta dinámicamente -->
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal del Editor -->
    <main id="main-content">
        <section class="editor-header">
            <h1>Panel de Edición</h1>
            <p>Modifica el contenido de la aplicación de forma rápida y sencilla.</p>
        </section>

        <!-- Selector de Archivo a Editar -->
        <div class="editor-controls">
            <label for="file-selector"><strong>¿Qué deseas editar?</strong></label>
            <select id="file-selector" class="form-select">
                <option value="site.json">Configuración General y Portada (site.json)</option>
                <option value="devocionales.json">Devocional del Día (devocionales.json)</option>
                <option value="articulos.json">Artículos (articulos.json)</option>
            </select>
            <button id="load-btn" class="btn-primary">Cargar Datos</button>
        </div>

        <!-- Área de Edición Dinámica -->
        <section class="editor-workspace">
            <form id="editor-form">
                <div id="form-fields-container">
                    <p class="placeholder-text">Selecciona un archivo arriba y haz clic en "Cargar Datos" para comenzar a editar.</p>
                </div>

                <!-- Botón de Guardar / Publicar -->
                <div class="form-actions" id="form-actions" style="display: none;">
                    <button type="submit" class="btn-success">Guardar Cambios y Publicar</button>
                    <span id="save-status" class="save-status"></span>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de página Fijo -->
    <footer id="main-footer">
        <p>&copy; 2026 - Diseñado con amor.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/github.js" defer></script>
    <script src="js/editor.js" defer></script>
</body>
</html>
