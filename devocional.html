<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocional Diario</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Menú de Navegación Fijo -->
    <header id="main-header">
        <nav class="navbar">
            <div class="logo-container">
                <a href="index.html" id="site-logo-text">App</a>
            </div>
            <ul id="menu-list" class="nav-links">
                <!-- Se inyecta dinámicamente desde menu.json -->
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal Devocional -->
    <main id="main-content">
        
        <!-- Devocional Principal del Día -->
        <article class="devocional-card" id="devocional-main">
            <header class="devocional-header">
                <span class="devocional-fecha" id="dev-fecha">Cargando fecha...</span>
                <h1 id="dev-titulo">Cargando devocional...</h1>
            </header>

            <!-- Cita / Versículo Destacado -->
            <div class="versiculo-box">
                <blockquote id="dev-versiculo">"..."</blockquote>
                <cite id="dev-pasaje"></cite>
            </div>

            <!-- Imagen opcional -->
            <div class="devocional-img-container" id="dev-img-container" style="display: none;">
                <img id="dev-img" src="" alt="Imagen devocional">
            </div>

            <!-- Cuerpo de la Reflexión -->
            <div class="devocional-body" id="dev-reflexion">
                <!-- Párrafos inyectados dinámicamente -->
            </div>

            <!-- Sección de Oración -->
            <div class="oracion-box" id="dev-oracion-box" style="display: none;">
                <h3>🙏 Oración de hoy</h3>
                <p id="dev-oracion"></p>
            </div>

            <!-- Preguntas para reflexionar -->
            <div class="preguntas-box" id="dev-preguntas-box" style="display: none;">
                <h3>💡 Para reflexionar</h3>
                <ul id="dev-preguntas"></ul>
            </div>
        </article>

        <!-- Sección de Historial / Anteriores -->
        <section class="historial-section">
            <h2>Devocionales Anteriores</h2>
            <div id="historial-list" class="historial-grid">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

    </main>

    <!-- Pie de página Fijo -->
    <footer id="main-footer">
        <p>&copy; 2026 - Diseñado con amor.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/devocional.js" defer></script>
</body>
</html>
