<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <!-- Manifest y PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- Estilos principales -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Menú de Navegación Fijo -->
    <header id="main-header">
        <nav class="navbar">
            <div class="logo-container">
                <a href="index.html" id="site-logo-text">App</a>
            </div>
            <ul id="menu-list" class="nav-links">
                <!-- Se inyecta dinámicamente desde menu.json -->
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal / Home -->
    <main id="main-content">
        <!-- Sección Hero (Portada) -->
        <section class="hero-section" id="hero-section">
            <div class="hero-content">
                <h1 id="hero-title">Cargando título...</h1>
                <p id="hero-subtitle">Cargando descripción...</p>
                <div id="hero-actions"></div>
            </div>
            <div class="hero-image-container">
                <img id="hero-img" src="" alt="Hero Image">
            </div>
        </section>

        <!-- Sección de Categorías o Accesos Directos -->
        <section class="categories-section">
            <h2>Categorías</h2>
            <div id="categories-grid" class="grid-container">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Pie de página Fijo -->
    <footer id="main-footer">
        <p>&copy; 2026 - Diseñado con amor.</p>
    </footer>

    <!-- Scripts de la aplicación -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js" defer></script>
    <script src="js/home.js" defer></script>
</body>
</html>
